name: SEO structured data, sitemap and canonical checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  seo:
    name: JSON-LD, sitemap and canonical validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: JSON-LD + sitemap/canonical suite
        run: bun run test:seo
